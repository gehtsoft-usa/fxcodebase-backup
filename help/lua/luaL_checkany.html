<h3><a name="luaL_checkany"><code>luaL_checkany</code></a></h3>
<pre>void luaL_checkany (lua_State *L, int narg);</pre>

<p>
Checks whether the function has an argument
of any type (including <b>nil</b>) at position <code>narg</code>.
