<h3><a name="luaL_checkudata"><code>luaL_checkudata</code></a></h3>
<pre>void *luaL_checkudata (lua_State *L, int narg, const char *tname);</pre>

<p>
Checks whether the function argument <code>narg</code> is a userdata
of the type <code>tname</code> (see <a href="luaL_newmetatable.html"><code>luaL_newmetatable</code></a>).
