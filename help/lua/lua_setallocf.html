<h3><a name="lua_setallocf"><code>lua_setallocf</code></a></h3>
<pre>void lua_setallocf (lua_State *L, lua_Alloc f, void *ud);</pre>

<p>
Changes the allocator function of a given state to <code>f</code>
with user data <code>ud</code>.
