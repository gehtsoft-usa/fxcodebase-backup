<h3><a name="pdf-print"><code>print (&middot;&middot;&middot;)</code></a></h3>
Receives any number of arguments,
and prints their values to <code>stdout</code>,
using the <a href="pdf-tostring.html"><code>tostring</code></a> function to convert them to strings.
<code>print</code> is not intended for formatted output,
but only as a quick way to show a value,
typically for debugging.
For formatted output, use <a href="pdf-string.format.html"><code>string.format</code></a>.
