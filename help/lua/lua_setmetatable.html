<h3><a name="lua_setmetatable"><code>lua_setmetatable</code></a></h3>
<pre>int lua_setmetatable (lua_State *L, int index);</pre>

<p>
Pops a table from the stack and
sets it as the new metatable for the value at the given
acceptable index.
