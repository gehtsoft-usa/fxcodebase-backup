<h3><a name="lua_iscfunction"><code>lua_iscfunction</code></a></h3>
<pre>int lua_iscfunction (lua_State *L, int index);</pre>

<p>
Returns 1 if the value at the given acceptable index is a C&nbsp;function,
and 0 otherwise.
