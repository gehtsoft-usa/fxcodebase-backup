<h3><a name="lua_isboolean"><code>lua_isboolean</code></a></h3>
<pre>int lua_isboolean (lua_State *L, int index);</pre>

<p>
Returns 1 if the value at the given acceptable index has type boolean,
and 0 otherwise.
