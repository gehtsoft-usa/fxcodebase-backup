<h3><a name="pdf-loadstring"><code>loadstring (string [, chunkname])</code></a></h3>


<p>
Similar to <a href="pdf-load.html"><code>load</code></a>,
but gets the chunk from the given string.


<p>
To load and run a given string, use the idiom

<pre>
     assert(loadstring(s))()
</pre>
