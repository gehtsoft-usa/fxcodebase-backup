<h3><a name="lua_isnil"><code>lua_isnil</code></a></h3>
<pre>int lua_isnil (lua_State *L, int index);</pre>

<p>
Returns 1 if the value at the given acceptable index is <b>nil</b>,
and 0 otherwise.
