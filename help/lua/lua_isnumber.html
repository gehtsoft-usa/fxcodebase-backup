<h3><a name="lua_isnumber"><code>lua_isnumber</code></a></h3>
<pre>int lua_isnumber (lua_State *L, int index);</pre>

<p>
Returns 1 if the value at the given acceptable index is a number
or a string convertible to a number,
and 0 otherwise.
