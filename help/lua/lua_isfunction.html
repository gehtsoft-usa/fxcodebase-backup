<h3><a name="lua_isfunction"><code>lua_isfunction</code></a></h3>
<pre>int lua_isfunction (lua_State *L, int index);</pre>

<p>
Returns 1 if the value at the given acceptable index is a function
(either C or Lua), and 0 otherwise.
