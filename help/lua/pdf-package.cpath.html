<h3><a name="pdf-package.cpath"><code>package.cpath</code></a></h3>


<p>
The path used by <a href="pdf-require.html"><code>require</code></a> to search for a C&nbsp;loader.


<p>
Lua initializes the C&nbsp;path <a href="pdf-package.cpath.html"><code>package.cpath</code></a> in the same way
it initializes the Lua path <a href="pdf-package.path.html"><code>package.path</code></a>,
using the environment variable <a name="pdf-LUA_CPATH"><code>LUA_CPATH</code></a>
(plus another default path defined in <code>luaconf.h</code>).




<p>
