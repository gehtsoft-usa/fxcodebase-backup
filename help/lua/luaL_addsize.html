<h3><a name="luaL_addsize"><code>luaL_addsize</code></a></h3>
<pre>void luaL_addsize (luaL_Buffer *B, size_t n);</pre>

<p>
Adds a string of length <code>n</code> previously copied to the
buffer area (see <a href="luaL_prepbuffer.html"><code>luaL_prepbuffer</code></a>) to the buffer <code>B</code>
(see <a href="luaL_Buffer.html"><code>luaL_Buffer</code></a>).
