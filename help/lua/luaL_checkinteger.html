<h3><a name="luaL_checkinteger"><code>luaL_checkinteger</code></a></h3>
<pre>lua_Integer luaL_checkinteger (lua_State *L, int narg);</pre>

<p>
Checks whether the function argument <code>narg</code> is a number
and returns this number cast to a <a href="lua_Integer.html"><code>lua_Integer</code></a>.
