<h3><a name="lua_tonumber"><code>lua_tonumber</code></a></h3>
<pre>lua_Number lua_tonumber (lua_State *L, int index);</pre>

<p>
Converts the Lua value at the given acceptable index
to a number (see <a href="lua_Number.html"><code>lua_Number</code></a>).
The Lua value must be a number or a string convertible to a number
(see <a href="2.2.1.html">&sect;2.2.1</a>);
otherwise, <a href="lua_tonumber.html"><code>lua_tonumber</code></a> returns&nbsp;0.
