<h3><a name="luaL_optinteger"><code>luaL_optinteger</code></a></h3>
<pre>lua_Integer luaL_optinteger (lua_State *L, int narg, lua_Integer d);</pre>

<p>
If the function argument <code>narg</code> is a number,
returns this number cast to a <a href="lua_Integer.html"><code>lua_Integer</code></a>.
If this argument is absent or is <b>nil</b>,
returns <code>d</code>.
Otherwise, raises an error.
