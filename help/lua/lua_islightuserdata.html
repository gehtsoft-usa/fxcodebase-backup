<h3><a name="lua_islightuserdata"><code>lua_islightuserdata</code></a></h3>
<pre>int lua_islightuserdata (lua_State *L, int index);</pre>

<p>
Returns 1 if the value at the given acceptable index is a light userdata,
and 0 otherwise.
